name: CI

# Runs the backend test suite, the frontend lint and build, and a check of the production
# Caddyfile on every pull request and on pushes to main. Tests mock Neo4j and the LLMs, so no
# secrets or services are needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first, or sentence-transformers pulls the multi-GB CUDA build
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
          # The entity extractor loads this model, and tries to download it mid-test when it's missing
          python -m spacy download en_core_web_sm
      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  caddy:
    name: Caddyfile check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The image production's web container builds from (deploy/web.Dockerfile). A Caddyfile that
      # doesn't parse would take the whole site down at the next deploy.
      - name: caddy validate
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_ADDRESS=localhost             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
